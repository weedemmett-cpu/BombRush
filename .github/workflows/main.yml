name: Build BombRush Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR with Maven
        run: mvn -B clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BombRush-Plugin
          path: target/BombRush-*.jar

      - name: Publish latest release JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BombRush Latest Build
          draft: false
          prerelease: false
          make_latest: true
          files: target/BombRush-*.jar
